# Metadata-only: this package is never built or published to PyPI.
# Install via the conda environment (see environment.yml) instead.
# No [build-system] table on purpose, so `pip install .` refuses to run.
[project]
name = "light-slides"
version = "0.0.0"
description = "A thin-section viewer for teaching mineralogy"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Buchanan Kerswell", email = "buck.kerswell@gmail.com" }]

[tool.pytest.ini_options]
testpaths = ["pipeline"]
