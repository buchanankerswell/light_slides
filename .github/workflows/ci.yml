name: ci

# Fast, fixture-free checks only: full verification (make build, the
# 73-check headless-browser pass) needs raw downloads, encodes, and a
# browser, so it stays a local step (see README).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    uses: buchanankerswell/actions/.github/workflows/validate-site.yml@v1
  design-drift:
    uses: buchanankerswell/actions/.github/workflows/design-drift.yml@v1
    with:
      static-dir: docs
